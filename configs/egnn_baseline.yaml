# Baseline EGNN — matches DS 595 Assignment 2 defaults
model: egnn
model_kwargs:
  d_hidden: 64
  d_msg: 32
  n_layers: 4
  return_activations: false

train:
  n_epochs: 100
  batch_size: 64
  lr: 0.001
  seed: 0
  log_every: 20

data:
  n_samples: 6400
  n_train: 2400
  n_particles: 10
  n_steps: 1000
  dt: 0.001

out: artifacts/runs/egnn_baseline
