[project]
name = "interp-physics"
version = "0.1.0"
description = "Mechanistic interpretability across physics-informed neural architectures on Coulomb dynamics"
readme = "README.md"
authors = [
    { name = "Achuthan Rathinam", email = "achurathinam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flax>=0.12.9",
    "jax>=0.11.2",
    "jaxlib>=0.11.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "optax>=0.2.8",
    "pyyaml>=6.0.3",
]

[project.scripts]
interp-make-data = "interp_physics.scripts.make_data:main"
interp-train = "interp_physics.scripts.train:main"
interp-probe = "interp_physics.scripts.probe:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
