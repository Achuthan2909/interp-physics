[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "buthesis-check"
version = "0.1.0"
description = "Check a thesis PDF against the BU CDS thesis template formatting rules"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
buthesis-check = "buthesis_check.cli:main"

[tool.setuptools]
packages = ["buthesis_check"]

[tool.setuptools.package-data]
buthesis_check = ["spec.toml"]
